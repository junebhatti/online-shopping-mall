# Brands the mall follows. Grows over time from ratings.
# kind: new = brand site / retailers; vintage = Depop, eBay and other resale only
# site: brand's own store
# feed: shopify  -> the store's public /products.json works (checked 2026-10-20).
#   Everything else is blocked (403) or not Shopify; those brands come in through eBay
#   and resale until department-store and retailer adapters exist (Phase 4).
# sale_only: only admit marked-down items. menswear_only: unlabeled products count as men's.
# aliases: other names retailers file the brand under (Yoox uses "Polo Ralph Lauren").

clothing:
  - { name: Buck Mason,            kind: new,  site: https://www.buckmason.com }
  - { name: Ralph Lauren,          kind: new,  site: https://www.ralphlauren.com, aliases: [Polo Ralph Lauren] }
  - { name: Nudie Jeans,           kind: new,  site: https://www.nudiejeans.com }
  - { name: Carhartt,              kind: new,  site: https://www.carhartt.com }
  - { name: Basketcase Gallery,    kind: new,  site: https://basketcasegallery.com }
  - { name: Los Angeles Apparel,   kind: new,  site: https://losangelesapparel.net, feed: shopify }
  - { name: Maison Margiela,       kind: new,  site: https://www.maisonmargiela.com }
  - { name: Acne Studios,          kind: new,  site: https://www.acnestudios.com }
  - { name: Stone Island,          kind: new,  site: https://www.stoneisland.com }
  - { name: rag & bone,            kind: new,  site: https://www.rag-bone.com }
  - { name: Theory,                kind: new,  site: https://www.theory.com }
  - { name: Lululemon,             kind: new,  site: https://shop.lululemon.com, sale_only: true }
  - { name: Banana Republic,       kind: new,  site: https://bananarepublic.gap.com }
  - { name: Merz b. Schwanen,      kind: new,  site: https://www.merz-schwanen.com }
  - { name: Arc'teryx,             kind: new,  site: https://arcteryx.com }
  - { name: Alo,                   kind: new,  site: https://www.aloyoga.com, feed: shopify, sale_only: true }
  - { name: Pool House New York,   kind: new,  site: https://poolhousenewyork.com, feed: shopify, menswear_only: true }

